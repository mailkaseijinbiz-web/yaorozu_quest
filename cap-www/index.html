<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>八百万クエスト</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 38%, #1c1018 0%, #0d0e16 55%, #07080f 100%);
      color: #f5f5f5; font-family: -apple-system, system-ui, "Hiragino Sans", sans-serif;
    }
    img { width: 112px; height: 112px; }
    h1 { font-size: 18px; margin: 0; letter-spacing: 0.08em; }
    p { font-size: 13px; color: #b8b8c0; max-width: 320px; line-height: 1.8; margin: 0; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid rgba(212,175,55,0.25);
      border-top-color: #d4af37; border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <img src="icon.png" alt="八百万クエスト" onerror="this.style.display='none'" />
  <h1>八百万クエスト</h1>
  <div class="spinner"></div>
  <p>
    神域へ接続しています…<br />
    この画面が続く場合は、ビルド時に <code>CAP_SERVER_URL</code>（公開中のサイトURL）が
    設定されているか確認してください。
  </p>
</body>
</html>
