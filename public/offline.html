<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>オフライン — 八百万クエスト</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 38%, #1c1018 0%, #0d0e16 55%, #07080f 100%);
      color: #f5f5f5; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    }
    img { width: 96px; height: 96px; }
    h1 { font-size: 18px; margin: 0; }
    p { font-size: 13px; color: #b8b8c0; max-width: 320px; line-height: 1.7; margin: 0; }
    button {
      margin-top: 8px; background: #d4af37; color: #3a2a05; border: 0; font-weight: 700;
      padding: 12px 22px; border-radius: 12px; font-size: 14px;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="八百万クエスト" />
  <h1>オフラインです</h1>
  <p>神域との通信が途絶えました。電波の届く場所で再び繋いでください。</p>
  <button onclick="location.reload()">再読み込み</button>
</body>
</html>
